# ==============================================================================
# CodeSentinel — Production Docker Compose Configuration
# Autonomous Static Security Analysis & DevSecOps Platform
# ==============================================================================

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codesentinel-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DEBUG=False
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - MAX_REQUEST_SIZE_BYTES=${MAX_REQUEST_SIZE_BYTES:-10485760}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://localhost:11434}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - CHROMA_DB_PATH=/app/data/chroma
    volumes:
      - codesentinel-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/platform/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  codesentinel-data:
    driver: local
